[package]
name = "fleet_server"
version.workspace = true
edition.workspace = true
publish = false
default-run = "fleet-server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fleet-server"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
fleet_brand.workspace = true
fleet_i18n = { workspace = true, features = ["schema"] }
fleet_lib.workspace = true
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
utoipa = { workspace = true, features = ["axum_extras", "uuid", "time"] }
utoipa-axum.workspace = true
uuid.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower.workspace = true
