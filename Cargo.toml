[workspace]
resolver = "3"
members = ["crates/fleet_i18n", "crates/fleet_lib", "crates/fleet_server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
fleet_i18n = { path = "crates/fleet_i18n" }
fleet_lib = { path = "crates/fleet_lib" }
axum = { version = "0.8", features = ["http2", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "catch-panic", "fs"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "json", "migrate", "macros", "derive"] }
utoipa = "6"
utoipa-axum = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["serde", "v7"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
thiserror = "2"
base64 = "0.22"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["reqwest-rustls"] }
http = "1"
getrandom = "0.4"
sha2 = "0.11"
argon2 = "0.6"
x25519-dalek = { version = "3", features = ["static_secrets"] }
aes-gcm = "0.11"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
